apiVersion: v1
kind: Namespace
metadata:
  name: event-exporter
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-exporter
  namespace: event-exporter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: event-exporter
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: event-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: event-exporter
subjects:
  - kind: ServiceAccount
    name: event-exporter
    namespace: event-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-exporter
  namespace: event-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: event-exporter
  template:
    metadata:
      labels:
        app: event-exporter
    spec:
      serviceAccountName: event-exporter
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/therealkaban9/kubernetes-event-exporter:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: EVENT_EXPORTER_CLUSTER
              value: demo
            - name: EVENT_EXPORTER_ENVIRONMENT
              value: dev
            - name: EVENT_EXPORTER_INGEST
              value: k8s-demo
            - name: EVENT_EXPORTER_SINK_URL
              value: https://victorialogs.example/insert/jsonline?_stream_fields=record_type,cluster,kubernetes.namespace_name
            - name: EVENT_EXPORTER_SINK_USERNAME
              valueFrom:
                secretKeyRef:
                  name: event-exporter-ingest
                  key: username
            - name: EVENT_EXPORTER_SINK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: event-exporter-ingest
                  key: password
            - name: EVENT_EXPORTER_BUSINESS_MAPPINGS
              value: '{"demo-application":"demo"}'
          ports:
            - name: http
              containerPort: 2112
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: event-exporter
  namespace: event-exporter
  labels:
    app: event-exporter
spec:
  selector:
    app: event-exporter
  ports:
    - name: http
      port: 2112
      targetPort: http
